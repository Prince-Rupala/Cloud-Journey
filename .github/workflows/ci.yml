name: Python CI

on:
  push:
    branches:
      - main:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: docker-practice/day44
        run: pytest

      - name: Build Docker image
        run: docker build -t day44-app ./docker-practice/day44

      - name: Run Docker container
        run: docker run --rm day44-app
